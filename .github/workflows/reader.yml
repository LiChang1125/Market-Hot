name: Publish Market Hot entry link
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/reader.yml", "deploy/pages-entry/**"]
permissions:
  contents: read
concurrency:
  group: market-hot-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: deploy/pages-entry
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: release
