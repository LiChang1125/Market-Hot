name: Publish Market Hot
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/reader.yml"
      - "scripts/pages/**"
      - "industry/**"
      - "packages/**"
      - "site/**"
permissions:
  contents: read
concurrency:
  group: market-hot-pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-build
          POSTGRES_DB: markethot_free
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:local-build@127.0.0.1:5432/markethot_free
      SITE_URL: https://lichang1125.github.io/Market-Hot
      COLLECT_ENABLED: "true"
      MODEL_CALLS_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Initialize build database
        run: |
          node scripts/migrate.ts
          node scripts/seed.ts
      - name: Collect enabled sources and select recent reporting
        run: node scripts/pages/collect.ts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .data/translation
          key: reader-argos-en-zh-1.9-433e7c4f
      - name: Translate English reading copy on CPU
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check ctranslate2==4.8.2 sentencepiece==0.2.3
          python scripts/pages/translate.py
      - name: Render and verify public output
        run: |
          node scripts/pages/render.ts
          node scripts/pages/verify.ts .data/pages-site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: .data/pages-site
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    steps:
      - name: Deploy
        id: release
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
